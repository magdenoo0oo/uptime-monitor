name: ci

# Runs the whole test suite (real HTTP server + in-memory MongoDB) on every push and pull request.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      # mongodb-memory-server downloads a MongoDB binary on first use; cache it between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm test
